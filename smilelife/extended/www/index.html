<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Smile Life</title>
<style>@font-face{font-family:Fredoka;src:url(fonts/Fredoka.ttf) format('truetype');font-weight:300 700;font-display:swap}@font-face{font-family:Nunito;src:url(fonts/Nunito.ttf) format('truetype');font-weight:200 1000;font-display:swap}</style>
<style>
:root{
  --bg:#fff4e4; --ink:#2b2233; --mute:#7a6f80; --line:#eadfd2; --panel:#ffffff;
  --accent:#ff6b4a; --gold:#ffd23f;
  --felt1:#1f8a6b; --felt2:#106450; --wood1:#1d2b6b; --wood2:#121a45;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:15px;overscroll-behavior:none}
body.table{background:radial-gradient(circle at 50% 35%,#4fb9f0 0%,#1a86d2 45%,#0b4f98 100%);color:#fff}
h1,h2,h3,.fred{font-family:Fredoka,Nunito,sans-serif;margin:0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:800;background:var(--ink);color:#fff}
button.sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
button.acc{background:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
input{font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.mute{color:var(--mute)}
.small{font-size:13px}
.logo{font-size:40px;font-weight:700;letter-spacing:-.5px}
.logo span{color:var(--accent)}
.hero{text-align:center;padding:18px 0 4px}
.list .item{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.code{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:40px;letter-spacing:6px;color:var(--accent);text-align:center}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:#f3ebe1;font-weight:700;font-size:12px;color:var(--ink)}
.note{background:#fff3d6;border:2px solid #ffe2a1;border-radius:14px;padding:10px 12px;font-size:13px;color:var(--ink)}
.err{background:#ffe3e0;border-color:#ffc2bb}
details summary{cursor:pointer;font-weight:800}
.rules li{margin:4px 0}
.rank{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:22px}

/* ---------- smileys ---------- */
.smiles{position:absolute;left:4px;top:4px;display:flex;gap:1px;z-index:3}
.smiles svg{width:12px;height:12px;display:block}
/* ---------- cartes ---------- */
.cd{position:relative;width:74px;height:106px;border-radius:8px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.22);overflow:hidden;color:#23285e;flex:none;user-select:none;-webkit-user-select:none;border:1px solid #d5dbe8}
.cd .hd{position:absolute;left:6px;right:6px;top:19px;height:11px;border-radius:2px;background:var(--hc,#23285e);color:#fff;font-size:7px;font-weight:900;letter-spacing:1.2px;text-align:center;line-height:11px;white-space:nowrap;overflow:hidden;text-transform:uppercase}
.cd .jt{position:absolute;left:4px;right:4px;top:17px;text-align:center;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:9.5px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#23285e}
.cd .jt::after{content:"";display:block;height:2px;margin:2px 8px 0;background:var(--hc,#23285e);border-radius:2px}
.cd .art{position:absolute;left:50%;top:35px;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--ac,#dfe8ff) 70%);box-shadow:inset 0 0 0 2px var(--hc,#23285e);display:flex;align-items:center;justify-content:center}
.cd .art span{font-size:27px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.cd .nm{position:absolute;left:5px;right:5px;bottom:4px;background:#ececf0;border:1px solid #c9cbd3;border-radius:5px;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:8.5px;line-height:1.05;text-align:center;padding:2px;min-height:17px;display:flex;align-items:center;justify-content:center;color:#2b2233}
.cd .ring{position:absolute;left:5px;top:34px;width:15px;height:15px;border-radius:50%;border:1.5px solid #a07a55;background:#fff;font-size:8.5px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#3a2a1a;z-index:2}
.cd .bills{position:absolute;right:4px;top:34px;display:flex;flex-direction:column;gap:2px;z-index:2}
.cd .bills.row{flex-direction:row;flex-wrap:wrap;width:30px;justify-content:flex-end}
.bill{display:block;width:13px;height:8px;background:#86d16f;border:1px solid #3f8f34;border-radius:1px;position:relative}
.bill::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:#f0b51b}
.cd .price{position:absolute;left:8px;right:8px;bottom:23px;background:#f4f4f6;border:1px solid #c9cbd3;border-radius:4px;display:flex;align-items:center;justify-content:center;gap:2px;padding:1px;font-size:7px;font-weight:900;color:#555;z-index:2}
.cd .price .bill{width:9px;height:6px}.cd .price .bill::after{left:3.5px;width:1.5px}
.cd .star{position:absolute;right:4px;top:4px;font-size:10px;z-index:3}
.cd .tag{position:absolute;left:12px;right:12px;top:31px;height:7px;border-radius:2px;background:#3aa3e8;color:#fff;font-size:5px;font-weight:900;text-align:center;line-height:7px;letter-spacing:.4px;z-index:2}
.cd.fonct .tag{background:#6b4fd0}
/* familles */
.f-etude{--hc:#1e1e24;--ac:#ffe9b8}
.f-salaire{--hc:#23285e;--ac:#e1f6da}
.f-metier{--hc:var(--jc,#23285e);--ac:#e8eefc}
.f-animal{--hc:#e8622c;--ac:#ffe7d6}
.f-voyage{--hc:#2a8fd6;--ac:#ddf1ff}
.f-maison{--hc:#b5452f;--ac:#e5f4ff}
.f-dist{--hc:#c9302c;--ac:#fff2c4}
.f-special{--hc:var(--sc,#6b4fd0);--ac:#f2edff}
.f-malus{--hc:#d7262e;--ac:#ffe3e3}
.f-mariage{background:linear-gradient(180deg,#bfe3fb,#e7f5ff);--hc:#e2468b;--ac:#fff}
.f-enfant{background:linear-gradient(180deg,#cfe9fb,#eef8ff);--hc:#e2468b;--ac:#fff8e8}
.f-enfant.girl{background:linear-gradient(180deg,#fbd3e5,#fff0f6)}
.f-flirt{background:radial-gradient(circle at 50% 45%,#ff4b4b,#d0121b 75%);border-color:#a50d14;--hc:#fff;--ac:#ffd2dc}
.f-flirt .hd{background:#fff;color:#d0121b}
.f-flirt .art{border-radius:0;width:50px;height:46px;margin-left:-25px;background:none;box-shadow:none}
.f-flirt .art::before{content:"";position:absolute;inset:0;background:#fff;clip-path:path('M25 44 C10 33 1 25 1 14 C1 6 7 1 14 1 C19 1 23 4 25 8 C27 4 31 1 36 1 C43 1 49 6 49 14 C49 25 40 33 25 44 Z')}
.f-flirt .art::after{content:"";position:absolute;inset:3px;background:radial-gradient(circle at 40% 35%,#fff,#ffd2dc);clip-path:path('M22 39 C9 29 1 22 1 12.5 C1 5.5 6 1 12 1 C16.5 1 20 3.5 22 7 C24 3.5 27.5 1 32 1 C38 1 43 5.5 43 12.5 C43 22 35 29 22 39 Z')}
.f-flirt .art span{position:relative;z-index:1;margin-top:-4px}
.f-adultere{background:#141414;border-color:#000;--hc:#e2468b;--ac:#4a3a2a}
.f-adultere .nm{background:#2a2a2a;color:#fff;border-color:#555}
.f-flirt .smiles svg circle:first-child{fill:#fff}
/* tailles */
.cd.t{width:56px;height:80px;border-radius:6px}
.cd.t .hd{top:15px;height:8px;font-size:5px;line-height:8px;left:5px;right:5px}
.cd.t .jt{top:14px;font-size:7px}
.cd.t .art{top:27px;width:34px;height:34px;margin-left:-17px}.cd.t .art span{font-size:20px}
.cd.t.f-flirt .art{width:38px;height:34px;margin-left:-19px;transform:scale(.76);transform-origin:top center;width:50px;height:46px;margin-left:-25px}
.cd.t .nm{font-size:6.8px;min-height:13px;bottom:3px;left:3px;right:3px;padding:1px}
.cd.t .smiles svg{width:9px;height:9px}
.cd.t .ring,.cd.t .bills,.cd.t .price,.cd.t .tag{display:none}
.cd.m{width:40px;height:57px;border-radius:5px;box-shadow:0 1px 0 rgba(0,0,0,.2),0 2px 4px rgba(0,0,0,.2)}
.cd.m .hd,.cd.m .jt,.cd.m .nm,.cd.m .ring,.cd.m .bills,.cd.m .price,.cd.m .tag,.cd.m .star{display:none}
.cd.m .art{top:16px;width:30px;height:30px;margin-left:-15px}.cd.m .art span{font-size:17px}
.cd.m.f-flirt .art{transform:scale(.62);transform-origin:top center;top:13px}
.cd.m .smiles{left:2px;top:2px}.cd.m .smiles svg{width:7px;height:7px}
.cd.big{width:110px;height:158px;border-radius:12px}
.cd.big .smiles svg{width:16px;height:16px}
.cd.big .hd{top:26px;height:15px;font-size:10px;line-height:15px}.cd.big .jt{top:25px;font-size:13px}
.cd.big .art{top:50px;width:66px;height:66px;margin-left:-33px}.cd.big .art span{font-size:38px}
.cd.big.f-flirt .art{transform:scale(1.35);transform-origin:top center;top:48px}
.cd.big .nm{font-size:12px;min-height:26px}
.cd.big .ring{top:50px;width:20px;height:20px;font-size:11px}.cd.big .bills{top:50px}.cd.big .tag{top:44px;height:9px;font-size:7px;line-height:9px}
.cd.spent{filter:grayscale(.7) brightness(.93)}
.cd.spent::after{content:"INVESTI";position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) rotate(-20deg);background:#23285e;color:#fff;font-size:8px;font-weight:900;padding:1px 4px;border-radius:3px;z-index:5}
.cd.m.spent::after{font-size:5px;padding:0 2px}
/* dos de carte */
.cd.back{background:#fff;border-color:#cfd8e6}
.cd.back .bk{position:absolute;inset:4px;border-radius:6px;background:radial-gradient(circle at 50% 42%,#7fd0ff 0%,#2b9be3 45%,#1166b8 100%);overflow:hidden}
.cd.back .bk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.14) 1.5px,transparent 2px) 0 0/9px 9px}
.cd.back .lg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) rotate(-8deg);text-align:center;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;line-height:.9}
.cd.back .lg .a{display:block;color:#fff;font-size:15px;text-shadow:0 2px 0 #0c4f90}
.cd.back .lg .b{display:block;color:#ffd23f;font-size:17px;text-shadow:0 2px 0 #0c4f90}
.cd.back .lg svg{width:20px;height:20px;display:block;margin:0 auto 2px}
.cd.t.back .lg .a{font-size:11px}.cd.t.back .lg .b{font-size:13px}.cd.t.back .lg svg{width:15px;height:15px}
.cd.m.back .lg .a,.cd.m.back .lg .b{display:none}.cd.m.back .lg svg{width:14px;height:14px}
/* ---------- table ---------- */
.tbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;max-width:760px;margin:0 auto}
.tbar button{background:rgba(0,0,0,.25);color:#fff;padding:8px 12px;border-radius:12px}
.tbar .pill{background:rgba(0,0,0,.25);color:#fff}
.tablewrap{max-width:760px;margin:0 auto;padding:0 10px 210px}
.opps{display:grid;grid-template-columns:repeat(var(--oc,1),1fr);gap:8px}
.seat{background:rgba(8,40,100,.28);border:2px solid rgba(255,255,255,.12);border-radius:16px;padding:8px;position:relative;transition:border-color .2s,background .2s}
.seat.cur{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,63,.25)}
.seat-h{display:flex;align-items:center;gap:6px;min-height:30px}
.seat-h .nmx{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ctr{display:flex;align-items:center;gap:4px;background:#fff;color:#23285e;border-radius:99px;padding:2px 10px 2px 3px;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:17px;box-shadow:0 2px 0 #9fb3d6;position:relative;border:2px solid #23285e}
.ctr svg{width:24px;height:24px}
.ctr.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.35)}60%{transform:scale(.95)}}
.hc{display:flex;align-items:center}
.hc .cd{margin-left:-24px}.hc .cd:first-child{margin-left:0}
.skipb{background:#c62828;color:#fff;border-radius:99px;font-size:11px;font-weight:900;padding:2px 7px}
.info{font-size:11.5px;opacity:.85;margin:2px 0 4px}
.tab{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;margin-top:4px;min-height:20px}
.col{position:relative;flex:none}
.col .cd{position:absolute;left:0}
.empty{font-size:12px;opacity:.7;padding:6px 2px}
.malrow{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.felt{margin:12px 0;border-radius:22px;padding:14px 12px;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.12),rgba(0,0,0,.1));border:3px solid rgba(255,255,255,.15);box-shadow:inset 0 0 30px rgba(0,0,0,.25)}
.piles{display:flex;justify-content:center;gap:26px;align-items:flex-end}
.pile{position:relative;width:74px;height:106px;cursor:pointer}
.pile .cd{position:absolute;left:0;top:0}
.pile .lbl{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:12px;font-weight:800;opacity:.9}
.pile.empty-p{border:2px dashed rgba(255,255,255,.4);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:.8}
.pile.can{animation:glow 1.4s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 10px var(--gold))}}
.pile .count{position:absolute;right:-8px;top:-8px;background:#2b2233;color:#fff;border-radius:99px;font-size:12px;font-weight:900;padding:2px 7px;z-index:5}
.status{text-align:center;margin-top:30px}
.status .t1{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:20px}
.status .t2{font-size:13px;opacity:.9;margin-top:2px}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btns button{padding:8px 12px;font-size:13px}
.btns .gbtn{background:rgba(0,0,0,.28);color:#fff}
.casino{margin:10px auto 0;max-width:330px;background:rgba(0,0,0,.25);border:2px dashed var(--gold);border-radius:14px;padding:8px 10px;text-align:center;font-size:13px}
.me{background:rgba(0,0,0,.22)}
.me .tab{min-height:80px}
.dropok{outline:3px dashed var(--gold);outline-offset:2px}
.dropover{background:rgba(255,210,63,.25)!important;outline:3px solid var(--gold)}
.log{font-size:12.5px;max-height:150px;overflow:auto;color:var(--ink)}
.log div{padding:3px 0;border-top:1px dashed var(--line)}
/* hand */
.handbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg,var(--wood1),var(--wood2));border-top:3px solid #ffd23f;box-shadow:0 -8px 20px rgba(0,0,0,.3);padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.handbar .acts{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.handbar .acts button{white-space:nowrap;padding:8px 11px;font-size:13px;border-radius:10px}
.handbar .acts .why{display:block;font-size:10.5px;font-weight:600;opacity:.85}
.handbar .acts .info2{color:#fff;font-size:12.5px;opacity:.9;padding:6px 2px}
.hand{position:relative;height:112px;max-width:740px;margin:0 auto}
.hand .hcard{position:absolute;bottom:0;transition:transform .15s,left .2s;touch-action:none}
.hand .hcard.sel{transform:translateY(-14px)}
.hand .hcard.sel .cd{box-shadow:0 0 0 3px var(--gold),0 8px 18px rgba(0,0,0,.35)}
.hand .hcard.must .cd{box-shadow:0 0 0 3px #fff,0 0 14px var(--gold)}
.handlbl{color:#fff;font-size:12px;font-weight:800;opacity:.9;margin-bottom:4px;display:flex;justify-content:space-between}
/* drag ghost */
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-60%) scale(1.12) rotate(-4deg);filter:drop-shadow(0 12px 16px rgba(0,0,0,.4))}
/* anims */
.enter{animation:enter .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes enter{0%{transform:scale(1.8) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.shake{animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.hit{animation:hit .8s}
@keyframes hit{0%{background:rgba(255,60,60,.6)}100%{}}
.float{position:fixed;z-index:120;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:22px;color:var(--gold);text-shadow:0 2px 0 #7a4b00;pointer-events:none;animation:floatup 1.2s forwards}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.2);opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
.fly{position:fixed;z-index:110;pointer-events:none;transition:all .45s cubic-bezier(.3,.7,.3,1)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:130;background:#2b2233;color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.3);animation:toast 2.2s forwards;max-width:90vw;text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:140;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* modal */
.modal{position:fixed;inset:0;z-index:90;background:rgba(10,20,15,.6);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;color:var(--ink);border-radius:22px 22px 0 0;width:100%;max-width:760px;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;justify-content:center}
.choices .ch{background:none;padding:0;border-radius:12px}
.cover{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#4fb9f0,#0b4f98);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:95;text-align:center;padding:20px}
.cover .logo{color:#fff}
.endbox{text-align:center}

/* ---------- écran de jeu plein écran ---------- */
body.table #app{max-width:760px;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0;margin:0 auto;overflow:hidden}
body.table .tbar{flex:none;padding:6px 10px}
body.table .tbar button{padding:6px 10px;font-size:13px}
.zone-opps{flex:1 1 0;min-height:90px;overflow-y:auto;padding:0 8px;-webkit-overflow-scrolling:touch}
.zone-felt{flex:none;padding:0 8px}
.zone-me{flex:0 1 auto;max-height:30%;overflow-y:auto;padding:0 8px 6px}
body.table .handbar{position:relative;flex:none}
.felt{margin:6px 0;padding:8px 10px;display:flex;gap:12px;align-items:center}
.felt .piles{gap:16px;flex:none}
.felt .status{margin:0;text-align:left;flex:1;min-width:0}
.felt .status .t1{font-size:17px}
.felt .btns{justify-content:flex-start;margin-top:6px}
.felt .casino{margin:6px 0 0}
.pile .lbl{bottom:-17px;font-size:11px}
.felt{padding-bottom:20px}
.seat{padding:6px 8px}
.seat-h .nmx{font-size:14px}
.info{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr{font-size:15px;padding:1px 8px 1px 2px}.ctr svg{width:20px;height:20px}
.cd.m .sb.mal{display:none}
.malrow .cd.m{width:26px;height:36px}.malrow .cd.m .art span{font-size:13px}
.hc .cd.m{width:22px;height:31px}.hc .cd{margin-left:-15px}
.hc .cd.m.back .lg svg{width:10px;height:10px}
.handbar{padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.handbar .acts{padding-bottom:6px;min-height:34px;align-items:center}
.handbar .acts button{padding:6px 9px;font-size:12.5px}
.handbar .acts .why{font-size:10px}

/* ===== rendu 3D / design ===== */
.seat{background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.14),rgba(6,32,84,.35));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -14px 24px rgba(0,0,0,.18),0 10px 22px rgba(0,0,0,.22);border-radius:20px}

/* effet carte bonus */
.burst{position:fixed;inset:0;z-index:160;pointer-events:none;display:flex;align-items:center;justify-content:center}
.bu-rays{position:absolute;width:180vmax;height:180vmax;background:repeating-conic-gradient(rgba(255,240,170,.35) 0 6deg,transparent 6deg 16deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:burays 1.9s linear forwards}

.bu-card{position:relative;perspective:800px;animation:bucard 1.9s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes bucard{0%{transform:scale(.2)}35%{transform:scale(1.25)}47%{transform:scale(1.15)}60%{transform:scale(1.8);opacity:0}100%{opacity:0}}
.bu-spin{transform-style:preserve-3d;animation:buspin .9s cubic-bezier(.3,.6,.3,1) forwards}

.bu-spin .cd{box-shadow:0 0 0 4px #fff,0 0 40px 10px rgba(255,230,120,.9)}
.bu-shine{position:absolute;inset:0;border-radius:12px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.9) 48%,transparent 62%);background-size:300% 100%;animation:bushine .9s linear forwards}
@keyframes bushine{0%{background-position:150% 0}100%{background-position:-150% 0}}
.bu-p{position:absolute;left:50%;top:50%;opacity:0}
.burst.pop .bu-p{animation:bup 1s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes bup{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 40px)) scale(1) rotate(var(--r));opacity:0}}
/* bleu brillant et contours réalistes */
body.table{background:radial-gradient(ellipse at 50% 30%,#7fd6ff 0%,#2b9af0 30%,#1569cf 62%,#0a3a86 100%)}

.seat,.felt{border:1.5px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(0,0,0,.25),inset 0 -18px 30px rgba(0,20,70,.25),0 0 0 1px rgba(0,30,90,.35),0 10px 24px rgba(0,20,60,.35)}

/* v15 : carte jouée en grand dans l'annonce */
.bw-stage{position:relative;width:150px;height:212px;margin-bottom:6px;perspective:900px;display:flex;align-items:center;justify-content:center}
.bw-rays{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.28) 0 9deg,transparent 9deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);
  opacity:0;animation:bwrays 1s .45s ease-out forwards,bwspin 14s linear infinite}
@keyframes bwrays{to{opacity:1}}
@keyframes bwspin{to{transform:rotate(360deg)}}
.bw-card{position:relative;width:110px;height:158px;transform-style:preserve-3d;transform:scale(1.32);
  animation:bwcin 1.05s cubic-bezier(.18,1.25,.35,1) both}
.bw-card .bwc-face,.bw-card .bwc-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bw-card .bwc-back{transform:rotateY(180deg)}
.bw-card .cd{margin:0;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.9),0 0 34px var(--w1)}
@keyframes bwcin{0%{transform:translateY(-55vh) scale(.35) rotateY(180deg) rotateZ(-25deg);opacity:0}
  15%{opacity:1}
  60%{transform:translateY(8px) scale(1.42) rotateY(-12deg) rotateZ(3deg)}
  80%{transform:translateY(-4px) scale(1.28) rotateY(4deg) rotateZ(-1deg)}
  100%{transform:scale(1.32) rotateY(0) rotateZ(0)}}
.bwc-shine{position:absolute;inset:0;border-radius:12px;overflow:hidden;pointer-events:none}
.bwc-shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:45%;left:-60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg);animation:bwshine 1.1s .95s ease-in-out forwards}
@keyframes bwshine{to{left:130%}}
.bigword.stay .bw-stage+.bw-t{margin-top:18px}
.bigword.stay .bw-stage~.bw-sub{margin-top:12px}
@media (max-height:640px){.bw-stage{transform:scale(.8);margin:-20px 0 -14px}}

function resolve(st,a){
  const me=st.turn,p=st.players[me],pd=st.pending;if(!pd)return 'Rien à choisir';
  if(pd.type==='peek'){st.pending=null;finish(st);return null}
  if(pd.type==='pickDiscard'){
    const k=a.pick;if(k==null||k<0||k>=st.discard.length)return 'Choix invalide';
    const t=st.discard.splice(k,1)[0];p.hand.push(t);st.pending=null;st.extra=true;st.mustPlay=true;
    log(st,{i:me,m:`récupère ${CARDS[t].ic} ${CARDS[t].n} dans la défausse`});
    if(!playable(st,me,t)){st.mustPlay=false}
    return null;
  }
  if(pd.type==='chance'){
    const k=a.pick;if(k==null||k<0||k>=pd.cards.length)return 'Choix invalide';
    const t=pd.cards[k];pd.cards.forEach((x,i)=>{if(i!==k)st.discard.push(x)});p.hand.push(t);st.pending=null;st.extra=true;
    if(playable(st,me,t))st.mustPlay=true;
    log(st,{i:me,m:'tente sa chance et garde une carte'});return null;
  }
  if(pd.type==='troc'){
    if(a.target==null||a.target===me||!st.players[a.target])return 'Choisis un joueur';
    swapRandom(st,me,a.target);st.pending=null;log(st,{i:me,j:a.target,m:'échange une carte au hasard avec @'});finish(st);return null;
  }
  if(pd.type==='casinoBet'){
    const k=a.pick;if(k==null||!p.hand[k]||cat(p.hand[k])!=='salaire')return 'Choisis un salaire de ta main';
    const t=p.hand.splice(k,1)[0];st.casino={owner:me,card:t,second:null};st.pending=null;
    log(st,{i:me,m:'ouvre 🎰 un casino avec une mise cachée'});finish(st);return null;
  }
  if(pd.type==='vengeance'){
    const k=a.malus;if(k==null||!p.received[k])return 'Choisis un malus';
    const t=p.received[k];
    if(a.target==null||a.target===me||!st.players[a.target]||!malusOk(st,a.target,t))return 'Ce malus ne peut pas viser ce joueur';
    p.received.splice(k,1);st.pending=null;applyMalus(st,a.target,t,me);finish(st);return null;
  }
  return 'Choix inconnu';
}
function endTurn(st){
  const p=st.players[st.turn];
  if(st.pending&&st.pending.type==='chance')st.pending.cards.forEach(x=>st.discard.push(x));
  st.pending=null;st.bonus=0;st.extra=false;st.mustPlay=false;p.piston=false;
  st.phase='draw';st.updated=Date.now();
  trimHand(st,p);
  if(p.active)p.active=p.active.filter(e=>!e.once||e.fresh);
  st.players.forEach(q=>(q.active||[]).forEach(e=>{if(e.once)e.fresh=0}));
  while(p.hand.length<handSize(p)&&st.deck.length)p.hand.push(st.deck.pop());
  if(!st.deck.length){st.status='ended';log(st,{m:'La pioche est vide : fin de la partie !'});return}
  if(st.replay){st.replay=false;return}
  const n=st.players.length;let i=st.turn;
  for(let g=0;g<n*5;g++){
    i=(i+1)%n;const q=st.players[i];
    if(q.skip>0){q.skip--;const e=(q.active||[]).find(x=>x.n>0);if(e){e.n--;if(!e.n)e.done=1}log(st,{i,m:'passe son tour'});continue}
    break;
  }
  st.turn=i;
  const nq=st.players[i];if(nq.active)nq.active=nq.active.filter(e=>!e.done);
}
function forceSkip(st){
  const p=st.players[st.turn];
  log(st,{i:st.turn,m:'est absent·e : tour passé'});
  if(st.pending&&st.pending.type==='casinoBet'){st.pending=null}
  endTurn(st);
}
function countCards(st){
  let n=st.deck.length+st.discard.length+st.used.length+st.removed.length+st.out.length;
  st.players.forEach(p=>n+=p.hand.length+p.life.length+p.received.length);
  if(st.casino)n+=1;
  if(st.pending&&st.pending.type==='chance')n+=st.pending.cards.length;
  return n;
}

function botValue(st,me,a){

function botCandidates(st){
  const me=st.turn,p=st.players[me],n=st.players.length,A=[];
  p.hand.forEach((t,h)=>{
    if(st.mustPlay&&h!==p.hand.length-1)return;

function botAction(st){

  const lead=()=>{let b=-1,bi=(me+1)%n;st.players.forEach((_,k)=>{const s=score(st,k);if(k!==me&&s>b){b=s;bi=k}});return bi};
  const pd=st.pending;
  if(pd){

    if(pd.type==='troc')return {type:'resolve',target:lead()};
    if(pd.type==='casinoBet'){let k=-1,bv=9;p.hand.forEach((t,i)=>{if(cat(t)==='salaire'&&CARDS[t].v<bv){bv=CARDS[t].v;k=i}});return {type:'resolve',pick:k}}

    const list=pd.type==='chance'?pd.cards:st.discard;

  }
  if(st.phase==='draw'){
    const top=st.discard[st.discard.length-1];
    if(top&&st.lastDiscarder!==me&&!(p.lvl===0&&Math.random()<0.6)){const s=JSON.parse(JSON.stringify(st));s.discard.pop();if(playable(s,me,top)&&cardWorth(s,me,top)>=(p.lvl===2?1.6:2.5))return {type:'draw',from:'discard'}}
    return {type:'draw',from:'deck'};
  }
  const lvl=p.lvl==null?1:p.lvl;
  const A=botCandidates(st);let best=null,bv=-99;
  if(lvl<2&&A.length&&Math.random()<(lvl===0?0.35:0.12)&&!st.mustPlay){const k=Math.floor(Math.random()*p.hand.length);return {type:'discard',card:k}}
  const base=n>1?st.players.map((_,k)=>score(st,k)):[];
  A.forEach(a=>{let v=botValue(st,me,a)+Math.random()*(lvl===0?3:lvl===2?0.1:1.2);
    if(lvl===2){try{const c=JSON.parse(JSON.stringify(st));if(!act(c,a)){const my=score(c,me)-base[me];let opp=0;for(let k=0;k<n;k++)if(k!==me){const d=score(c,k)-base[k];opp=Math.min(opp,d)}v+=1.0*my-0.9*opp;if(c.status==='ended'&&c.winner===me)v+=50}}catch(e){}}
    if(v>bv){bv=v;best=a}});
  if(best&&(bv>0.5||st.mustPlay||st.extra))return best;
  // défausse la carte la moins utile
  let k=0,wv=99;p.hand.forEach((t,i)=>{let v=cardWorth(st,me,t);if(lvl===2){const nx=(me+1)%n;try{const o=cardWorth(st,nx,t);if(o>2.5&&cat(t)!=='malus')v+=0.6*o}catch(e){}}if(v<wv){wv=v;k=i}});
  if(st.mustPlay&&best)return best;
  return {type:'discard',card:k};
}

function scheduleLoop(t0){
  const A=AC,b=60/SONG.bpm,out=MUS.gain;

  const dl=A.createDelay();dl.delayTime.value=b*.75;const fb=A.createGain();fb.gain.value=.28;const wet=A.createGain();wet.gain.value=.35;dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(out);
  const lead=A.createGain();lead.gain.value=1;lead.connect(out);lead.connect(dl);
  SONG.chords.forEach((ch,bar)=>{const tb=t0+bar*4*b;
    // piano électrique : rythme bossa 3+3+2
    [0,1.5,3].forEach(o=>ch.forEach(m=>{mNote(out,tb+o*b,mf(m),b*.9,'sine',.035,{att:.005,rel:.25});mNote(out,tb+o*b,mf(m)*2,b*.4,'triangle',.008,{att:.005})}));

    for(let k=0;k<8;k++)mNoise(out,tb+k*b/2,.06,k%2?.025:.045,7000);

  });

}

function diffSnap(){
  const s={ids:G.players.map(p=>p.life.map(x=>x.id)),recv:G.players.map(p=>p.received.length),score:G.players.map((_,i)=>score(G,i)),turn:G.turn,deck:G.deck.length,status:G.status,hand:G.players.map(p=>p.hand.length),code:code+':'+(G.created||0)+':'+G.players.length,disc:G.discard.length,used:(G.used||[]).length,lk:G.lseq||0};
  const ev={newIds:new Set(),hits:[],gains:[],myTurn:false,drew:false,ended:false,placed:false,steal:false,words:[]};
  if(snap&&snap.code===s.code){
    s.ids.forEach((ids,i)=>{const old=new Set(snap.ids[i]||[]);ids.forEach(id=>{if(!old.has(id)){ev.newIds.add(id);ev.placed=true;const it=G.players[i].life.find(x=>x.id===id);if(it)ev.words.push({t:it.t,i})}})});
    s.recv.forEach((n,i)=>{if(n>(snap.recv[i]||0)){ev.hits.push(i);ev.words.push({t:G.players[i].received[n-1],i})}});
    if(s.used>(snap.used||0)){const u=G.used[G.used.length-1];const lg=G.log.slice().reverse().find(e=>e.i!=null&&/joue/.test(e.m||''));if(CARDS[u])ev.words.push({t:u,i:lg?lg.i:G.turn})}
    s.score.forEach((n,i)=>{if(n!==snap.score[i])ev.gains.push([i,n-snap.score[i]])});
    if(snap.turn!==s.turn||snap.status!==s.status)ev.turnChanged=true;
    if(s.deck<snap.deck)ev.drew=true;
    if(s.disc>snap.disc)ev.discarded=true;
    if(s.status==='ended'&&snap.status!=='ended')ev.ended=true;
    const last=G.log[G.log.length-1];if(last&&/pique/.test(last.m||''))ev.steal=true;
    const fresh=G.log.filter(e=>e.k&&e.k>(snap.lk||0));const mi0=myIdx();
    fresh.forEach(e=>{
      if(/passe son tour/.test(e.m||'')&&e.i!=null){ev.words.push({kind:'skip',i:e.i});ev.skipped=true}
      if(/^défausse /.test(e.m||'')&&e.i!=null&&e.i!==mi0){const nm=(e.m||'').replace(/^défausse \S+ /,'');const t=Object.keys(CARDS).find(k=>CARDS[k].n===nm);ev.words.push({kind:'disc',i:e.i,t})}
      if(/démissionne/.test(e.m||'')&&e.i!=null&&e.i!==mi0)ev.words.push({kind:'info',i:e.i,ic:'👋',txt:'DÉMISSION',sub:'quitte son métier'});
      if(/^divorce$/.test(e.m||'')&&e.i!=null&&e.i!==mi0)ev.words.push({kind:'info',i:e.i,ic:'💔',txt:'DIVORCE',sub:'divorce volontairement'});
      if(e.i!=null&&e.i!==mi0&&/^(prend |récupère |échange |ouvre |mise |offre |tente sa chance|perd son métier)/.test(e.m||'')){
        const icm=(e.m.match(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/u)||['🃏'])[0];
        ev.words.push({kind:'info',i:e.i,ic:icm,txt:/défausse/.test(e.m)?'PREND LA DÉFAUSSE':/échange/.test(e.m)?'ÉCHANGE':/casino|mise/.test(e.m)?'CASINO':/offre/.test(e.m)?'CADEAU':/chance/.test(e.m)?'CHANCE':/perd son métier/.test(e.m)?'MÉTIER PERDU':'ACTION',sub:e.m.split('@').join(e.j!=null?pname(e.j):'')})}
    });
    if(ev.skipped&&!ev.turnChanged)ev.turnChanged=true;
    if(/attentat/.test((last&&last.m)||'')&&!ev.words.some(w=>w.t==='m_attentat'))ev.words.push({t:'m_attentat',i:last.i});
    const epi=fresh.find(e=>/épidémie :/.test(e.m||''));if(epi&&!ev.words.some(w=>w.t==='m_epidemie'))ev.words.push({t:'m_epidemie',i:epi.i});
    fresh.forEach(e=>{if(/potion/.test(e.m||''))ev.words.push({kind:'info',i:e.j!=null?e.j:e.i,ic:'🧪',txt:'PROTÉGÉ !',sub:'est protégé·e par la potion magique'});
      if(/^vole /.test(e.m||'')&&e.i!==mi0)ev.words.push({kind:'info',i:e.i,ic:'🪄',txt:'SORTILÈGE',sub:e.m.split('@').join(pname(e.j))});});
  }
  snap=s;return ev;

/* ---------------- glisser-déposer ---------------- */
function dropAction(h,zone){
  const p=G.players[G.turn],t=p.hand[h],c=cat(t);
  if(zone==='discard')return {type:'discard',card:h};
  if(zone==='casino')return {type:'bet',card:h};
  if(zone&&zone.startsWith('opp-')){const i=+zone.slice(4);
    if(c==='malus')return CARDS[t].global?{type:'malus',card:h}:{type:'malus',card:h,target:i};
    if(CARDS[t].tgt)return {type:'special',card:h,target:i};
    return null;}
  if(zone==='me'||zone==='felt'){
    if(c==='malus')return CARDS[t].global?{type:'malus',card:h}:null;
    if(c==='special')return CARDS[t].tgt?null:{type:'special',card:h};
    if(zone==='me')return {type:'own',card:h};
  }
  return null;
}
function zoneOf(x,y){let el=document.elementFromPoint(x,y);while(el&&el!==document.body){if(el.dataset&&el.dataset.drop)return {el,zone:el.dataset.drop};el=el.parentElement}return null}
function canDragNow(){const mi=myIdx();return G&&G.status==='playing'&&mi===G.turn&&!G.players[G.turn].bot&&G.phase==='play'&&!G.pending&&!busy}
let press=null;
document.addEventListener('pointerdown',e=>{
  const hc=e.target.closest('.hcard');if(!hc||view!=='game')return;
  const h=+hc.dataset.hi;
  press={h,x:e.clientX,y:e.clientY,el:hc,timer:setTimeout(()=>startDrag(e.clientX,e.clientY),280),moved:false};
});
function startDrag(x,y){
  if(!press||!canDragNow()){return}
  const h=press.h;const t=G.players[G.turn].hand[h];
  if(G.mustPlay&&h!==G.players[G.turn].hand.length-1){toast('Joue d\'abord la carte prise dans la défausse');sfx('err');press=null;return}
  buzz(30);sfx('pick');
  const g=document.createElement('div');g.className='ghost';g.innerHTML=face(t);g.style.left=x+'px';g.style.top=y+'px';document.body.appendChild(g);
  press.el.style.opacity='.25';
  drag={h,g,over:null};
  document.querySelectorAll('[data-drop]').forEach(z=>{const a=dropAction(h,z.dataset.drop);if(a&&!tryAct(a))z.classList.add('dropok')});
}
document.addEventListener('pointermove',e=>{
  if(press&&!drag){if(Math.hypot(e.clientX-press.x,e.clientY-press.y)>12){clearTimeout(press.timer);
      // glisser rapide vers le haut = drag immédiat
      if(press.y-e.clientY>20&&canDragNow()){startDrag(e.clientX,e.clientY)}else press.moved=true}}
  if(!drag)return;e.preventDefault();
  drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
  const z=zoneOf(e.clientX,e.clientY);const el=z&&z.el;
  if(drag.over!==el){if(drag.over)drag.over.classList.remove('dropover');if(el&&el.classList.contains('dropok'))el.classList.add('dropover');drag.over=el}
},{passive:false});
function endDrag(e,cancel){
  if(press)clearTimeout(press.timer);
  if(!drag){if(press&&!press.moved&&!cancel){tapCard(press.h)}press=null;return}
  const d=drag;drag=null;press=null;d.g.remove();
  document.querySelectorAll('.dropok,.dropover').forEach(z=>z.classList.remove('dropok','dropover'));
  const z=cancel?null:zoneOf(e.clientX,e.clientY);
  const a=z?dropAction(d.h,z.zone):null;
  if(a){const err=tryAct(a);if(!err){sel=null;deferRender=false;perform(a);return}toast(err);sfx('err')}
  else if(z)toast(z.zone==='discard'?'':'Tu ne peux pas poser cette carte ici'),sfx('err');
  deferRender=false;render();
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.hcard,.cd'))e.preventDefault()});
document.addEventListener('pointercancel',e=>endDrag(e,true));

function scheduleBot(retry){
  if(botTimer||busy||!G||G.status!=='playing'||!G.players[G.turn].bot)return;
  if(mode==='online'&&G.host!==me)return;
  if(mode!=='local'&&mode!=='online')return;
  botTimer=setTimeout(()=>{botTimer=null;if(!G||G.status!=='playing'||!G.players[G.turn].bot||busy||drag)return;
    if(wordBusy||wordQ.length||tbTimer||document.querySelector('.turnban,.burst')){scheduleBot(true);return}perform((G.tuto?tutoBotAction:botAction)(JSON.parse(JSON.stringify(G))),true)},retry?100:60);
}
async function perform(a,isBot){
  let st=JSON.parse(JSON.stringify(G));
  let err=a==='force'?(forceSkip(st),null):act(st,a);
  if(err&&isBot){for(const f of [{type:'discard',card:0},{type:'endTurn'},'force']){st=JSON.parse(JSON.stringify(G));err=f==='force'?(forceSkip(st),null):act(st,f);if(!err)break}}
  if(err){flash=err;render();return}
  if(isBot&&G.tuto&&G.phase==='play'&&st.phase==='draw')TUTO.botTurn++;
  let drawFx=null;
  if(!isBot&&a&&a.type==='draw'){const from=document.getElementById(a.from==='discard'?'discPile':'deckPile')||document.getElementById(a.from==='discard'?'h3disc':'h3deck');if(from)drawFx={r:from.getBoundingClientRect(),disc:a.from==='discard'}}
  sel=null;
  if(mode==='local'){G=st;render();if(drawFx)drawFly(drawFx);return}
  busy=true;G=st;render();if(drawFx)drawFly(drawFx);
  try{await db.doc('games/'+code).set(st)}catch(e){flash="L'action n'a pas pu être enregistrée. Vérifie ta connexion et réessaie.";}
  busy=false;render();
}

  const sub=()=>{if(!live)return;try{un=db.collection('games/'+c+'/seats').onSnapshot(q=>{if(flash&&/joueurs/.test(flash)){flash='';}applySeats(q.docs)},e=>{flash='Liste des joueurs indisponible ('+((e&&e.code)||'erreur')+'), nouvelle tentative…';if(view==='lobby')render();setTimeout(sub,3000)})}catch(e){setTimeout(sub,3000)}};
  sub();

  poll=setInterval(()=>{if(!live||view!=='lobby'||code!==c)return;db.collection('games/'+c+'/seats').get().then(q=>applySeats(q.docs)).catch(()=>{})},4000);

async function joinGame(c){
  if(!needName())return;
  c=(c||'').trim().toUpperCase();if(!/^[A-Z]{4}$/.test(c)){flash='Le code fait 4 lettres.';render();return}
  try{
    const s=await db.doc('games/'+c).get();
    if(!s.exists){flash='Partie introuvable.';render();return}
    const g=s.data();
    if(!!g.ext!==EXT_BUILD){flash=EXT_BUILD?'Cette partie est sur Smile Life classique : ouvre-la avec Smile Life.':'Cette partie utilise les extensions : ouvre-la avec Smile Life+.';render();return}
    if(g.status==='lobby'){await db.doc(`games/${c}/seats/${me}`).set({name:cleanName(),av:myAv,joined:Date.now()});openGame(c);return}
    if((g.pids||[]).includes(me)){openGame(c);return}
    flash='Cette partie a déjà commencé.';render();
  }catch(e){flash='Impossible de rejoindre pour le moment.';render()}

async function createGame(){
  if(!needName())return;

    await db.doc('games/'+c).set({status:'lobby',ext:EXT_BUILD?1:0,host:me,hostName:cleanName(),created:Date.now()});
    await db.doc(`games/${c}/seats/${me}`).set({name:cleanName(),av:myAv,joined:Date.now()});
    openGame(c);
  }catch(e){flash='Impossible de créer la partie : '+(e&&e.message||'erreur');render()}
}

    firebase.initializeApp(cfg);
    db=firebase.firestore();
    try{db.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
    firebase.auth().onAuthStateChanged(u=>{
      if(!u)return;
      clearTimeout(timer);
      if(me===u.uid)return;
      me=u.uid;
      if(unsubOpen)unsubOpen();if(unsubMine)unsubMine();
      unsubOpen=db.collection('games').where('status','==','lobby').limit(30).onSnapshot(q=>{
        const now=Date.now();
        openGames=q.docs.map(d=>Object.assign({id:d.id},d.data())).filter(g=>now-(g.created||0)<86400000&&!!g.ext===EXT_BUILD).sort((a,b)=>(b.created||0)-(a.created||0));
        if(view==='home')render();
      },()=>{});
      unsubMine=db.collection('games').where('pids','array-contains',me).onSnapshot(q=>{
        myGames=q.docs.map(d=>{const g=d.data();return {id:d.id,ext:!!g.ext,status:g.status,players:(g.players||[]).length,u:g.updated||0}}).filter(g=>g.ext===EXT_BUILD).sort((a,b)=>b.u-a.u);
        if(view==='home')render();
      },()=>{});
      render();
    });
    firebase.auth().signInAnonymously().catch(e=>{clearTimeout(timer);loadingNote="Connexion à Firebase impossible : "+(e&&e.message||'erreur')+". Vérifie que la connexion « Anonyme » est activée.";render()});
  }catch(e){loadingNote=OFF;render()}
})();

/* ================= Tutoriel débutant ================= */
const TUTO={on:false,step:0,botTurn:0,shown:-1};
function tutoStart(){
  const deck=[];for(const k in DECK)for(let i=0;i<DECK[k];i++)deck.push(k);shuffle(deck);
  const take=t=>{const i=deck.indexOf(t);if(i>=0)deck.splice(i,1);return t};
  const myHand=['etude','mariage','h_petite','a_chien','sp_chance'].map(take);
  const botHand=['j_pizza','a_lapin','etude','s1','f_zoo'].map(take);
  // ordre de pioche (le dernier élément est pioché en premier)
  const seq=['etude','a_chat','j_garag','m_maladie','v_rio','s2','etude','m_licen','a_poussin','f_parc','s1','a_cochon','e_1'].filter(t=>CARDS[t]).map(take);
  deck.push(...seq.reverse());
  const b=randBot([myName]);
  G={status:'playing',players:[{name:myName||'Toi',av:myAv,hand:myHand,life:[],skip:0,received:[]},{name:b.name,bot:true,av:b.av,hand:botHand,life:[],skip:0,received:[]}],
    pids:['',''],deck,discard:[],used:[],removed:[],out:[],turn:0,phase:'draw',nid:1,lastDiscarder:-1,casino:null,pending:null,bonus:0,extra:false,mustPlay:false,
    log:[{m:'Tutoriel : la partie commence !'}],updated:Date.now(),tuto:true};
  TUTO.on=true;TUTO.step=0;TUTO.botTurn=0;TUTO.shown=-1;
  mode='local';snap=null;revealed=0;sel=null;view='game';render();
}
function tutoBotAction(st){
  const p=st.players[st.turn];
  if(st.pending)return botAction(st);
  if(st.phase==='draw')return {type:'draw',from:'deck'};
  const want=[['j_pizza'],['m_maladie'],['a_lapin','v_rio'],['etude'],['a_poussin','s1']][TUTO.botTurn]||[];
  for(const t of want){const h=p.hand.indexOf(t);if(h<0)continue;
    if(CARDS[t].c==='malus'){if(malusOk(st,0,t))return {type:'malus',card:h,target:0}}
    else if(!canOwn(st,st.turn,t))return {type:'own',card:h}}
  return botAction(st);
}
const me0=()=>G.players[0],has=(t)=>me0().life.some(x=>x.t===t),hasCat=c=>me0().life.some(x=>cat(x.t)===c);
const myTurnDraw=()=>G.turn===0&&G.phase==='draw'&&!busy;
const myTurnPlay=()=>G.turn===0&&G.phase==='play';
const handSel=t=>{const i=me0().hand.indexOf(t);return i>=0?`.hcard[data-hi="${i}"]`:'#hand'};
const TSTEPS=[
  {t:'👋 Bienvenue dans Smile Life !',x:"Le but du jeu est simple : construire la vie la plus heureuse. Chaque carte que tu poses devant toi rapporte des <b>smileys 😊</b>. À la fin, celui qui en a le plus gagne !",next:1},
  {t:'😊 Les smileys',x:"Regarde en haut à gauche de chaque carte : les petits visages indiquent combien de smileys elle rapporte. Ton total s'affiche ici, dans la pastille blanche.",sel:'#ctr0',next:1},
  {t:'🂠 Ton tour : pioche !',x:"Chaque tour commence toujours de la même façon : <b>tu pioches une carte</b>. Touche le tas de cartes bleu.",sel:'#deckPile',done:()=>G.phase==='play'||G.turn!==0},
  {t:'🎓 Pose des études',x:"Les études sont la base d'une belle carrière. Touche la carte <b>Études</b> dans ta main, puis <b>« Poser »</b>. Astuce : tu peux aussi garder ton doigt appuyé dessus et la faire glisser sur ton jeu.",sel:()=>handSel('etude'),done:()=>hasCat('etude')},
  {t:'🤖 Au tour de l\'ordinateur',x:"Bravo, +1 smiley ! Après avoir posé une carte, ton tour est fini. Regarde ce que joue l'ordinateur : une bulle t'explique chacune de ses cartes.",done:()=>myTurnDraw()&&TUTO.botTurn>=1},
  {t:'🂠 Encore une carte',x:"C'est de nouveau à toi. Pioche !",sel:'#deckPile',done:()=>G.phase==='play'||G.turn!==0},
  {t:'🔧 Un métier !',x:"Tu as pioché <b>Garagiste</b>. Le chiffre dans le rond indique les études demandées (1 : tu les as !). Les billets verts montrent le salaire maximum qu'il accepte. Pose-le !",sel:()=>handSel('j_garag'),done:()=>hasCat('metier')},
  {t:'💼 Bien joué !',x:"Un métier rapporte 2 smileys et surtout, il te permet de poser des <b>salaires</b>. Sans métier, impossible de gagner de l'argent !",next:1},
  {t:'⏳ L\'ordinateur joue…',x:"Attention, l'ordinateur peut aussi t'attaquer avec des <b>cartes rouges : les malus</b>…",done:()=>me0().received.length>0},
  {t:'🤒 Aïe, un malus !',x:"L'ordinateur t'a donné une <b>Maladie</b> : tu vas passer ton prochain tour. Les malus reçus s'affichent en pastilles rouges à côté de ton nom. <b>Touche la pastille rouge</b> pour revoir son effet quand tu veux.",sel:'.zone-me .mchip',next:1},
  {t:'⏳ Patience…',x:"Tu passes ton tour à cause de la maladie. L'ordinateur rejoue.",done:()=>myTurnDraw()},
  {t:'🂠 Ça va mieux !',x:"Tu es guéri. Pioche une carte.",sel:'#deckPile',done:()=>G.phase==='play'||G.turn!==0},
  {t:'💶 Un salaire',x:"Voici un <b>Salaire 2</b>. Ton garagiste accepte jusqu'à 2 billets : pose-le ! Les salaires servent aussi d'argent pour acheter une maison ou un voyage.",sel:()=>handSel('s2'),done:()=>hasCat('salaire')},
  {t:'⏳ L\'ordinateur joue…',x:"Regarde bien ses cartes…",done:()=>myTurnDraw()},
  {t:'🂠 Pioche',x:"À toi ! Pioche une carte.",sel:'#deckPile',done:()=>G.phase==='play'||G.turn!==0},
  {t:'😈 À toi d\'attaquer !',x:"Tu as pioché <b>Licenciement</b> : l'ordinateur va perdre son métier ! Touche la carte puis le bouton <b>« → "+'{BOT}'+" »</b>, ou fais-la glisser sur son jeu en haut.",sel:()=>handSel('m_licen'),done:()=>G.players[1].received.length>0||G.turn!==0},
  {t:'💥 Joli coup !',x:"Son métier est parti à la défausse. Les malus sont précieux : garde-les pour le joueur qui mène la partie !",next:1},
  {t:'⏳ L\'ordinateur joue…',x:"Il va essayer de se rattraper…",done:()=>myTurnDraw()},
  {t:'🂠 Pioche',x:"Pioche une carte.",sel:'#deckPile',done:()=>G.phase==='play'||G.turn!==0},
  {t:'💌 L\'amour !',x:"Un <b>Flirt</b> ! Pour te marier il faut d'abord flirter. Pose-le. (Astuce : si tu flirtes au même endroit que le dernier flirt d'un adversaire, tu lui piques !)",sel:()=>handSel('f_parc'),done:()=>hasCat('flirt')},
  {t:'⏳ L\'ordinateur joue…',x:"Encore un petit tour pour lui…",done:()=>myTurnDraw()},
  {t:'🂠 Pioche',x:"Pioche une carte.",sel:'#deckPile',done:()=>G.phase==='play'||G.turn!==0},
  {t:'💍 Le grand jour !',x:"Tu as un flirt, tu peux donc te marier ! Pose la carte <b>Mariage</b> : elle vaut 3 smileys et permet ensuite d'avoir des <b>enfants</b> 👶.",sel:()=>handSel('mariage'),done:()=>has('mariage')},
  {t:'🏆 Tu es prêt !',x:"Tu connais l'essentiel : <b>piocher, poser, attaquer</b>.<br>• Les maisons 🏠 et voyages ✈️ s'achètent avec tes salaires.<br>• Les cartes spéciales (arc-en-ciel, chance…) sont expliquées dans le bouton <b>🃏 Cartes</b>.<br>• La partie se termine quand la pioche est vide.",end:1},
];
function tutoUpdate(){
  if(!TUTO.on||!G||!G.tuto){document.getElementById('coach')?.remove();return}
  let s=TSTEPS[TUTO.step];
  while(s&&s.done&&s.done()){TUTO.step++;s=TSTEPS[TUTO.step]}
  document.querySelectorAll('.tuto-hl').forEach(x=>x.classList.remove('tuto-hl'));
  if(!s)return;
  if(s.sel){const q=typeof s.sel==='function'?s.sel():s.sel;const el=document.querySelector(q);if(el)el.classList.add('tuto-hl')}
  let c=document.getElementById('coach');
  if(TUTO.shown!==TUTO.step||!c){
    c&&c.remove();c=document.createElement('div');c.id='coach';
    const x=s.x.replace('{BOT}',esc(G.players[1].name));
    c.innerHTML=`<div class="co-box"><div class="co-mascot">${SUNFACE}</div><div class="co-body"><div class="co-step">Étape ${TUTO.step+1} / ${TSTEPS.length}</div><b>${s.t}</b><p>${x}</p>
      ${s.next?'<button class="acc co-btn" data-act="tutoNext">Suivant ➜</button>':''}${s.end?'<div class="row"><button class="acc co-btn" data-act="tutoPlay">🎮 Jouer une vraie partie</button><button class="sec co-btn" data-act="tutoQuit">Accueil</button></div>':''}</div>
      <button class="co-x" data-act="tutoQuit">✕</button></div>`;
    document.body.appendChild(c);TUTO.shown=TUTO.step;sfx('pick');
  }
}
function tutoQuit(){TUTO.on=false;document.getElementById('coach')?.remove();document.querySelectorAll('.tuto-hl').forEach(x=>x.classList.remove('tuto-hl'))}

</script>
